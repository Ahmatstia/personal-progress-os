name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    env:
      # Nilai TEST saja untuk static validation & build. Bukan secret produksi.
      DATABASE_URL: "file:./prisma/dev.db"
      AUTH_SECRET: "ci-test-secret-0123456789abcdef0123456789abcdef"
      AUTH_ACCESS_CODE: "ci-test-access-code"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build